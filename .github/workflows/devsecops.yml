name: DevSecOps security gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret & dotenv scan (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Block tracked .env secret files
        shell: bash
        run: |
          set -euo pipefail
          leaked=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -Ev '\.(example|sample|template)$' || true)
          if [[ -n "$leaked" ]]; then
            echo "Tracked environment file(s) detected and blocked:" >&2
            echo "$leaked" >&2
            exit 1
          fi

      - name: Install Gitleaks CLI (pinned release + SHA-256 checksum)
        shell: bash
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${base_url}/${archive}" -o "/tmp/${archive}"
          curl -sSfL "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          (cd /tmp && grep "  ${archive}\$" gitleaks_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/${archive}" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan commit range and working tree for secrets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          gitleaks dir --no-banner --redact .
          if [[ "$EVENT_NAME" == "pull_request" && -n "$BASE_SHA" && -n "$HEAD_SHA" ]]; then
            gitleaks git --no-banner --redact --log-opts="${BASE_SHA}..${HEAD_SHA}" .
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            gitleaks git --no-banner --redact --log-opts="${BEFORE_SHA}..${GITHUB_SHA}" .
          else
            gitleaks git --no-banner --redact --log-opts="-n 20" .
          fi

  python-security:
    name: Python SAST & dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install security scanners
        run: python -m pip install --no-cache-dir --upgrade pip pip-audit bandit

      - name: Static application security scan (Bandit medium/high)
        run: bandit -r backend/app -ll -q

      - name: Python dependency vulnerability audit (pip-audit)
        run: pip-audit -r backend/requirements.lock --desc

  npm-audit:
    name: NPM dependency audit (${{ matrix.workspace }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workspace: [frontend, admin, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Audit npm lockfile for high/critical vulnerabilities
        run: npm audit --audit-level=high
