# Opt-in homepage API startup override.
# Apply only Alembic revision 013 separately before starting the upgraded API.
# Do not allow Dockerfile's automatic 'alembic upgrade head' or seed step.
services:
  api:
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
