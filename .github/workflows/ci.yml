name: Application checks
on:
  push:
    branches: [main, reference-theme-mobile, chore/protect-local-source-20261020]
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit supplied by the candidate workflow
        required: false
        type: string
        default: ''
      server_images_only:
        description: Isolated API/web/admin candidates only; full push/PR/main checks remain the default
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  environment:
    name: Environment boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Enforce isolated server candidate scope
        if: inputs.server_images_only
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/chore/protect-local-source-20261020' ]]
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          echo 'API/web/admin candidate checks only. Mobile advisory families remain unresolved; Android and production release are NOT approved. Full push/PR/main audits remain mandatory.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/check-environment.py --env-file .env.example --mode development
      - run: python scripts/check-environment.py --env-file .env.test.example --mode test --compose-project vistrah-ci-test
  backend:
    name: Backend and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: vistrah_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: vistrah_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vistrah_ci -d vistrah_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://vistrah_ci:disposable-ci-only@127.0.0.1:5432/vistrah_ci_test
      CATALOGUE_FILE: ${{ github.workspace }}/shared/catalogue.json
      EXTERNAL_SOURCE_ACQUISITION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
  clients:
    name: Client (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.server_images_only && '["frontend","admin"]' || '["frontend","admin","mobile"]') }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_WEB_SESSION_MODE: cookie
      EXPO_PUBLIC_API_URL: https://api.vistrah.in
      EXPO_PUBLIC_ADMIN_URL: https://admin.vistrah.in
      EXPO_PUBLIC_MAPTILER_WEB_API_KEY: ${{ vars.EXPO_PUBLIC_MAPTILER_WEB_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - if: matrix.package != 'admin'
        run: npm test
      - if: matrix.package != 'mobile'
        run: npm run build
      - if: matrix.package == 'mobile'
        run: npx --no-install expo export --platform web --output-dir dist-ci
  dependency-audit:
    name: Dependency audit (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.server_images_only && '["frontend","admin"]' || '["frontend","admin","mobile"]') }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm audit --audit-level=high
