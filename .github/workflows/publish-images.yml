name: Publish release images
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Test candidate: full 40-character commit SHA on chore/protect-local-source-20261020. Leave blank for the existing main release.'
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main' && inputs.candidate_sha == ''
    uses: ./.github/workflows/ci.yml
  publish:
    name: Publish (${{ matrix.image }})
    needs: checks
    if: github.ref == 'refs/heads/main' && inputs.candidate_sha == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: backend/Dockerfile
          - image: web
            dockerfile: frontend/Dockerfile
          - image: admin
            dockerfile: admin/Dockerfile
          - image: phone-web
            dockerfile: frontend/Dockerfile.phone
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Image identity
        id: identity
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identity.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            EXPO_PUBLIC_MAPTILER_WEB_API_KEY=${{ vars.EXPO_PUBLIC_MAPTILER_WEB_API_KEY }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=min
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Record immutable reference
        env:
          IMAGE_NAME: ${{ steps.identity.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $IMAGE_NAME@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
  resolve_candidate:
    if: github.ref == 'refs/heads/chore/protect-local-source-20261020' && inputs.candidate_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact candidate and approval configuration
        id: source
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full lowercase commit SHA is required.' >&2; exit 1; }
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" "$GITHUB_SHA"
          git show "$CANDIDATE_SHA:backend/Dockerfile" | grep -Fq 'apt-get install -y --no-install-recommends ffmpeg'
          gh api "repos/$GITHUB_REPOSITORY/environments/test-candidates" > "$RUNNER_TEMP/candidate-environment.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          configuration = json.loads((Path(os.environ['RUNNER_TEMP']) / 'candidate-environment.json').read_text())
          rules = configuration.get('protection_rules', [])
          if not any(rule.get('type') == 'required_reviewers' and rule.get('reviewers')
                     and rule.get('prevent_self_review') is True for rule in rules):
              raise SystemExit('STOP: test-candidates needs required reviewers and prevention of self-approval; no candidate will be built.')
          PY
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "Candidate commit: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
  approve_candidate:
    needs: resolve_candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: test-candidates
      url: https://github.com/${{ github.repository }}/tree/${{ needs.resolve_candidate.outputs.sha }}
    steps:
      - run: echo 'Candidate image publication approved; no runtime deployment is configured.'
  candidate_checks:
    needs: [resolve_candidate, approve_candidate]
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.resolve_candidate.outputs.sha }}
  publish_candidate:
    name: Test candidate (${{ matrix.image }})
    needs: [resolve_candidate, approve_candidate, candidate_checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: backend/Dockerfile
          - image: web
            dockerfile: frontend/Dockerfile
          - image: admin
            dockerfile: admin/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve_candidate.outputs.sha }}
          persist-credentials: false
      - name: Candidate identity
        id: identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.resolve_candidate.outputs.sha }}
          IMAGE: ${{ matrix.image }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/candidate-$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$CANDIDATE_SHA-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identity.outputs.name }}:${{ steps.identity.outputs.tag }}
          build-args: |
            EXPO_PUBLIC_MAPTILER_WEB_API_KEY=${{ vars.EXPO_PUBLIC_MAPTILER_WEB_API_KEY }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve_candidate.outputs.sha }}
          provenance: mode=min
          cache-from: type=gha,scope=candidate-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=candidate-${{ matrix.image }}
      - name: Record candidate immutable reference
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.resolve_candidate.outputs.sha }}
          IMAGE_NAME: ${{ steps.identity.outputs.name }}
          IMAGE_TAG: ${{ steps.identity.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "### $IMAGE_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: $IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $IMAGE_NAME@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
