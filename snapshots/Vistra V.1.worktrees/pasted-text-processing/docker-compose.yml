services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vistra
      POSTGRES_USER: vistra
      POSTGRES_PASSWORD: vistra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vistra -d vistra"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/api
    environment:
      DATABASE_URL: postgresql+psycopg://vistra:vistra@db:5432/vistra
      APP_ENV: development
      JWT_SECRET: local-development-only-change-me
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
