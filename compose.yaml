services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vistrah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vistrah-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-vistrah}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vistrah}:${POSTGRES_PASSWORD:-vistrah-local-only}@db:5432/${POSTGRES_DB:-vistrah}
      JWT_SECRET: ${JWT_SECRET:-}
      SECRET_FILE: /data/.runtime-secret
      SEED_CATALOGUE: ${SEED_CATALOGUE:-true}
      SOURCE_NETWORK_ENABLED: ${SOURCE_NETWORK_ENABLED:-true}
      REMOTIVE_ENABLED: ${REMOTIVE_ENABLED:-true}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_ACCESS_CONFIRMED: ${ADZUNA_ACCESS_CONFIRMED:-false}
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:${WEB_PORT:-3000}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-VISTRAH}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - api_data:/data
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [python, -m, app.workflow_worker]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vistrah}:${POSTGRES_PASSWORD:-vistrah-local-only}@db:5432/${POSTGRES_DB:-vistrah}
      JWT_SECRET: ${JWT_SECRET:-}
      SECRET_FILE: /data/.runtime-secret
      SOURCE_NETWORK_ENABLED: ${SOURCE_NETWORK_ENABLED:-true}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_ACCESS_CONFIRMED: ${ADZUNA_ACCESS_CONFIRMED:-false}
    volumes:
      - api_data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -m, app.workflow_worker_health]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_URL: http://api:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}}
      ADMIN_APP_URL: ${ADMIN_APP_URL:-http://localhost:${ADMIN_PORT:-3200}}
      HOSTNAME: 0.0.0.0
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    environment:
      API_URL: http://api:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-http://localhost:${ADMIN_PORT:-3200},http://127.0.0.1:${ADMIN_PORT:-3200}}
      HOSTNAME: 0.0.0.0
    ports:
      - '127.0.0.1:${ADMIN_PORT:-3200}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
  api_data:
