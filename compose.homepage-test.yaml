# Disposable homepage QA only. Never combine with compose.yaml or vistrah20.
name: vistrah-homepage-test
services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: vistrah_homepage_test
      POSTGRES_PASSWORD: homepage-test-only
      POSTGRES_DB: vistrah_homepage_test
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000']
    environment:
      DATABASE_URL: postgresql+psycopg://vistrah_homepage_test:homepage-test-only@db:5432/vistrah_homepage_test
      VISTRAH_TEST_PROJECT: vistrah-homepage-test
      APP_ENV: development
      SECRET_FILE: /data/.runtime-secret
      SEED_CATALOGUE: 'false'
      SOURCE_NETWORK_ENABLED: 'false'
      REMOTIVE_ENABLED: 'false'
      ADZUNA_ACCESS_CONFIRMED: 'false'
      PUBLIC_APP_URL: http://127.0.0.1:3111
    volumes: [api_data:/data]
    ports: ['127.0.0.1:8111:8000']
    depends_on: {db: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: {context: ., dockerfile: frontend/Dockerfile}
    environment:
      API_URL: http://api:8000
      COOKIE_SECURE: 'false'
      ALLOWED_ORIGINS: http://127.0.0.1:3111,http://localhost:3111,http://127.0.0.1:4111,http://localhost:4111
      HOSTNAME: 0.0.0.0
    ports: ['127.0.0.1:3111:3000']
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
  admin:
    build: {context: ., dockerfile: admin/Dockerfile}
    environment:
      API_URL: http://api:8000
      COOKIE_SECURE: 'false'
      ALLOWED_ORIGINS: http://127.0.0.1:3211,http://localhost:3211
      HOSTNAME: 0.0.0.0
    ports: ['127.0.0.1:3211:3000']
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
  phone-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile.phone
      args:
        EXPO_PUBLIC_ADMIN_URL: http://127.0.0.1:3211
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/app/']
      interval: 5s
      timeout: 5s
      retries: 20
  preview:
    image: caddy:2.10.2-alpine
    volumes: ['./scripts/homepage-test.Caddyfile:/etc/caddy/Caddyfile:ro']
    ports: ['127.0.0.1:4111:80']
    depends_on:
      web: {condition: service_healthy}
      phone-web: {condition: service_healthy}
volumes:
  postgres_data:
  api_data:
