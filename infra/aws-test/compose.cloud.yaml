name: vistrah-cloud
services:
  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vistrah
      POSTGRES_DB: vistrah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run prepare-cloud.sh first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U vistrah -d vistrah']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    image: vistrah20-api:latest
    pull_policy: never
    restart: unless-stopped
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000']
    environment: &api_environment
      DATABASE_URL: postgresql+psycopg://vistrah:${POSTGRES_PASSWORD:?Missing database password}@db:5432/vistrah
      JWT_SECRET: ${JWT_SECRET:?Missing cloud signing secret}
      SEED_CATALOGUE: 'false'
      APP_ENV: development
      PUBLIC_APP_URL: https://vistrah.in
      SOURCE_NETWORK_ENABLED: 'false'
      REMOTIVE_ENABLED: 'false'
      ADZUNA_ACCESS_CONFIRMED: 'false'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    image: vistrah20-worker:latest
    pull_policy: never
    profiles: [worker]
    restart: unless-stopped
    command: [python, -m, app.workflow_worker]
    environment: *api_environment
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, app.workflow_worker_health]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    image: vistrah20-web:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      COOKIE_SECURE: 'true'
      ALLOWED_ORIGINS: https://vistrah.in
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
  admin:
    image: vistrah20-admin:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      COOKIE_SECURE: 'true'
      ALLOWED_ORIGINS: https://admin.vistrah.in
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
